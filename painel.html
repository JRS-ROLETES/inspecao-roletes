/* Painel para projetar em reunião: fundo grafite, números grandes, semáforo dos equipamentos como peça central. */
:root{color-scheme:dark;
--bg:#0c1822;--p1:#132331;--p2:#1b3144;--ln:#25405a;--tx:#eaf0f5;--mut:#93a7b8;--az:#4d9be0;
--vm:#ef4a3c;--am:#f5c02b;--vd:#43c463;--cz:#6b7f91;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 var(--f);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;font-stretch:115%;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--az);outline-offset:2px}
.wrap{max-width:1800px;margin:0 auto;padding:22px 28px 30px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.marca{display:flex;align-items:center;gap:14px;flex:1;min-width:260px}
.marca img{width:46px;height:46px;border-radius:12px}
.marca h1{font-size:26px;font-weight:800;font-stretch:120%}
.marca p{margin:2px 0 0;color:var(--mut);font-size:14px}
.seg{display:flex;background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:4px}
.seg button{border:0;background:none;color:var(--mut);padding:9px 18px;border-radius:10px;font-weight:650;cursor:pointer}
.seg button.on{background:var(--az);color:#06121c}
.hora{text-align:right;color:var(--mut);font-size:13px;min-width:150px}
.hora b{display:block;color:var(--tx);font-size:26px;font-weight:700;font-stretch:115%}
.ic{border:1px solid var(--ln);background:var(--p1);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--tx);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.k{background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:18px 20px;min-width:0;position:relative;overflow:hidden}
.k .r{font-size:14px;color:var(--mut);display:flex;align-items:center;gap:8px}
.k .r i{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.k b{display:block;font-size:clamp(34px,3.6vw,58px);font-weight:800;font-stretch:122%;line-height:1.05;margin-top:8px}
.k .v{font-size:clamp(15px,1.3vw,21px);font-weight:600;margin-top:4px}
.k .s{font-size:13px;color:var(--mut);margin-top:6px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#0a141d;margin-top:10px}
.bar i{display:block;height:100%}
.g{background:var(--vd)}.y{background:var(--am)}.rr{background:var(--vm)}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.pn{background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:18px 20px;min-width:0}
.pn+.pn{margin-top:18px}
.pt{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pt h2{font-size:21px;font-weight:700;flex:1}
.pt span{color:var(--mut);font-size:14px}
.cont{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cont div{display:flex;align-items:center;gap:8px;background:var(--p2);border-radius:99px;padding:6px 14px;font-size:14px}
.cont b{font-size:18px}
.cont i{width:12px;height:12px;border-radius:50%}
.eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.eq{display:flex;gap:14px;background:var(--p2);border-radius:14px;padding:14px;border-left:5px solid var(--cz);min-width:0}
.eq.vm{border-left-color:var(--vm)}.eq.am{border-left-color:var(--am)}.eq.vd{border-left-color:var(--vd)}
.sem{display:flex;flex-direction:column;gap:6px;background:#08121a;padding:7px;border-radius:14px;align-self:flex-start;flex:none}
.sem i{width:20px;height:20px;border-radius:50%;background:#26394a}
.sem i.on.vm{background:var(--vm);box-shadow:0 0 14px var(--vm)}.sem i.on.am{background:var(--am);box-shadow:0 0 14px var(--am)}.sem i.on.vd{background:var(--vd);box-shadow:0 0 14px var(--vd)}
.eq .f{flex:1;min-width:0}
.eq h3{font-size:20px;font-weight:800;font-stretch:118%}
.eq .m{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq .n{display:flex;gap:12px;font-size:13.5px;margin-top:7px;flex-wrap:wrap}
.eq .n em{font-style:normal;font-weight:700}
.eq .st{font-size:12.5px;color:var(--mut);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12.5px;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--ln)}
td{padding:9px 8px;border-bottom:1px solid #1c3044;vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tt td{border-bottom:0;font-weight:800;font-size:16px;padding-top:12px}
.hb{height:7px;border-radius:99px;background:#0a141d;overflow:hidden;display:flex;margin-top:5px;min-width:80px}
.vmT{color:var(--vm)}.amT{color:var(--am)}
.vazio{color:var(--mut);padding:18px 4px;text-align:center}
.rod{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin-top:20px}
.aviso{background:#3a2a05;color:#ffd77a;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.con{max-width:460px;margin:12vh auto;background:var(--p1);border:1px solid var(--ln);border-radius:20px;padding:26px}
.con label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.con input{width:100%;background:#0a141d;border:1px solid var(--ln);border-radius:12px;padding:12px;color:var(--tx)}
.con button{margin-top:18px;width:100%;border:0;border-radius:12px;padding:13px;background:var(--az);color:#06121c;font-weight:700;cursor:pointer}
.con p{color:var(--mut);font-size:14px}
.eq.click,tr.click{cursor:pointer}
.eq.click:hover{background:#21394e}.eq.click:focus-visible,tr.click:focus-visible{outline:3px solid var(--az)}
tr.click:hover td{background:#17293a}
.volta{border:0;background:none;color:var(--az);font-weight:700;font-size:16px;cursor:pointer;padding:6px 0;margin-bottom:12px}
.det{display:flex;align-items:center;gap:20px;background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:20px 24px;margin-bottom:18px;flex-wrap:wrap}

.det h2{font-size:clamp(30px,3vw,46px);font-weight:800;font-stretch:122%}
.det .m{color:var(--mut);font-size:15px;margin-top:4px}
.det .f{flex:1;min-width:240px}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:3px 11px;background:#22405c;color:#a9d1f5;vertical-align:middle;margin-left:8px;font-stretch:100%}
.tag.dos{background:#4a3a08;color:#ffd77a}
.av{background:#3b1414;color:#ffb3ab;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:600;margin-top:4px;display:inline-block}
.av.am{background:#3a2a05;color:#ffd77a}
.cod{display:inline-block;background:#08121a;border:1px solid var(--ln);border-radius:8px;padding:2px 8px;font-weight:700;font-size:13.5px}
.sit{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700}
.sit.vm{background:var(--vm);color:#fff}.sit.am{background:var(--am);color:#2b1f00}
.eqd+.eqd{margin-top:18px}
.eqd .cab{display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.eqd .cab .sem{flex-direction:row}
.eqd .cab h3{font-size:24px;font-weight:800;font-stretch:118%}
.eqd .cab .f{flex:1;min-width:220px}
.mini{display:flex;gap:18px;flex-wrap:wrap;font-size:14.5px;color:var(--mut)}
.mini b{color:var(--tx);font-size:18px}
.mapa-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.mapa-ctl select{background:var(--p1);border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:10px 14px;font:inherit;font-weight:600}
.leg{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:14px}
.leg span{display:flex;align-items:center;gap:6px}
.mapa{background:#fff;color:#111;border-radius:16px;padding:14px 14px 14px 0;border-left:14px solid #fff;overflow-x:auto;margin-bottom:20px}
.mapa table{border-collapse:collapse;font-size:14px;color:#111;width:auto}
.mapa th,.mapa td{border:1px solid #1e1e1e;padding:0;color:#111;border-bottom:1px solid #1e1e1e}
.mapa .tit{background:#fff;text-align:left;padding:8px 12px;font-size:18px;font-weight:800;border-bottom:2px solid #111}
.mapa .sub{text-align:right;padding:6px 12px;font-weight:700;font-size:15px}
.mapa .eqn{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:14px;padding:10px 4px;height:120px;white-space:nowrap;text-align:left}
.mapa .cin{background:#d9d9d9}
.mapa .n{width:34px;text-align:center;font-weight:700;font-size:15px}
.mapa .ptn{padding:8px 10px;font-weight:700;font-size:14.5px;white-space:nowrap;text-transform:uppercase}
.mapa .gr{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;width:30px;text-align:center}
.mapa .cel{width:46px;height:44px;text-align:center;cursor:pointer}
.mapa .cel:hover{background:#eef4fa}
.mapa .cel svg{width:30px;height:30px;display:block;margin:auto}
.mapa .ini{border-left:4px solid #111}
.mapa .fx,.mapa .fx2,.mapa .fx3{position:sticky;background:#fff;z-index:2}
.mapa .fx{left:0}.mapa th.fx{background:#d9d9d9}
.mapa td.fx,.mapa th.fx{left:0}.mapa td.n{width:36px;min-width:36px;max-width:36px;box-sizing:border-box}.mapa td.fx2{left:36px}.mapa td.gr{width:30px;min-width:30px;max-width:30px;box-sizing:border-box}.mapa td.fx3{left:66px}

.mapa .gr{background:#fff}
.mapa .vaz{color:#bbb;font-size:12px}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.pop .cx{background:var(--p1);border:1px solid var(--ln);border-radius:18px;max-width:560px;width:100%;padding:20px 22px;max-height:85vh;overflow:auto}
.pop h3{font-size:20px;margin-bottom:6px}
.pop ul{margin:8px 0 0;padding-left:20px}.pop li{margin:4px 0}
.pop .fe{float:right;border:0;background:var(--p2);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
@media (max-width:640px){.wrap{padding:16px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hora{display:none}.marca h1{font-size:21px}}
</style>
</head>

const ls = { get(k, d) { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) { } } };
const S = { mapaInsp: '', ver: null, srv: ls.get('srv', SERVIDOR_PADRAO), codigo: ls.get('codigo', ''), area: ls.get('area', 'todas'), data: ls.get('data', null), sync: ls.get('sync', 0), erro: '', carregando: false };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const brlC = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const nf = v => (Number(v) || 0).toLocaleString('pt-BR');
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const pt = v => v.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
const p2 = n => String(n).padStart(2, '0');
const fData = ms => { const d = new Date(ms); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear(); };
const cmp = (a, b) => String(a).localeCompare(String(b), 'pt-BR', { numeric: true, sensitivity: 'base' });
const pl = (n, a, b) => nf(n) + ' ' + (n === 1 ? a : b);

async function api(p) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  try { const r = await fetch(S.srv, { method: 'POST', body: JSON.stringify(p), signal: ctl.signal }); return await r.json(); }
  finally { clearTimeout(t); }
}
async function carregar() {
  if (!S.srv || !S.codigo || S.carregando) return;
  S.carregando = true;
  try {
    const r = await api({ action: 'sync', codigo: S.codigo });
    if (!r.ok) { S.erro = r.erro === 'codigo-equipe' ? 'Código de acesso incorreto.' : 'Erro do servidor: ' + r.erro; if (r.erro === 'codigo-equipe') { S.codigo = ''; ls.set('codigo', ''); } }
    else { S.data = r; S.sync = Date.now(); S.erro = ''; ls.set('data', r); ls.set('sync', S.sync); }
  } catch (e) { S.erro = 'Sem conexão com o servidor. Mostrando os últimos dados recebidos.'; }
  S.carregando = false; render();
}

/* ----- cálculos (os mesmos do app) ----- */
function calcular() {
  const d = S.data || { insp: [], equip: [], tipo: [], rol: [] };
  const I = {}, E = {}, T = {};
  d.insp.forEach(i => { I[i.id] = i; });
  d.tipo.forEach(t => { T[t.id] = t; });
  const naArea = id => I[id] && (S.area === 'todas' || I[id].area === S.area);
  d.equip.forEach(e => { if (e.ativo !== false && naArea(e.inspId)) E[e.id] = e; });
  const at = d.rol.filter(r => r.status !== 'trocado' && E[r.equipId]);
  const tr30 = d.rol.filter(r => r.status === 'trocado' && E[r.equipId] && (r.trocadoEm || 0) > Date.now() - 30 * 864e5).length;
  const vm = r => r.nivel !== 'am', un = r => r.pos === 'cav' ? 3 : 1, pr = r => T[r.tipoId] ? Number(T[r.tipoId].preco) || 0 : 0;
  const novo = () => ({ vmN: 0, vmV: 0, amN: 0, amV: 0, vmU: 0, amU: 0, semPreco: 0 });
  const soma = (g, r) => { const k = vm(r) ? 'vm' : 'am'; g[k + 'N']++; g[k + 'V'] += pr(r); g[k + 'U'] += un(r); if (!pr(r)) g.semPreco++; };
  const G = novo(); at.forEach(r => soma(G, r));
  const eqs = Object.values(E).map(e => { const g = novo(); at.filter(r => r.equipId === e.id).forEach(r => soma(g, r)); g.total = e.bal === 'dos' ? 3 + (Number(e.ncav) || 0) : (Number(e.ncav) || 0) * 3 + (Number(e.nret) || 0); g.bons = Math.max(0, g.total - g.vmU - g.amU); return Object.assign(g, { e }); })
    .sort((a, b) => ((FORD[a.e.farol] ?? 3) - (FORD[b.e.farol] ?? 3)) || ((b.vmU + b.amU) / (b.total || 1) - (a.vmU + a.amU) / (a.total || 1)) || cmp(a.e.nome, b.e.nome));
  G.total = eqs.reduce((s, x) => s + x.total, 0); G.bons = Math.max(0, G.total - G.vmU - G.amU);
  const mi = new Map();
  Object.values(I).filter(i => i.ativo && (S.area === 'todas' || i.area === S.area)).forEach(i => mi.set(i.id, Object.assign(novo(), { id: i.id, nome: i.nome, area: i.area, ne: 0 })));
  Object.values(E).forEach(e => { if (mi.has(e.inspId)) mi.get(e.inspId).ne++; });
  at.forEach(r => { if (!mi.has(r.inspId)) mi.set(r.inspId, Object.assign(novo(), { id: r.inspId, nome: I[r.inspId] ? I[r.inspId].nome : '—', ne: 0 })); soma(mi.get(r.inspId), r); });
  const insp = [...mi.values()].sort((a, b) => (b.vmV + b.amV) - (a.vmV + a.amV) || cmp(a.nome, b.nome));
  const mc = new Map();
  at.forEach(r => { if (!mc.has(r.tipoId)) mc.set(r.tipoId, { t: T[r.tipoId], vm: 0, am: 0 }); mc.get(r.tipoId)[vm(r) ? 'vm' : 'am']++; });
  const compra = [...mc.values()].map(x => Object.assign(x, { pu: x.t ? Number(x.t.preco) || 0 : 0 })).sort((a, b) => (b.pu * b.vm - a.pu * a.vm) || cmp(a.t ? a.t.ni : '', b.t ? b.t.ni : ''));
  const far = { vd: 0, am: 0, vm: 0, x: 0 }; eqs.forEach(x => { far[FAROL[x.e.farol] ? x.e.farol : 'x']++; });
  return { G, eqs, insp, compra, far, tr30, I, T, at, d, novo, soma, vm, pr };
}
const barra = g => { const a = pct(g.amU, g.total), r = pct(g.vmU, g.total); return `<div class="bar"><i class="g" style="width:${Math.max(0, 100 - a - r)}%"></i><i class="y" style="width:${a}%"></i><i class="rr" style="width:${r}%"></i></div>`; };
const sem = f => `<span class="sem" role="img" aria-label="Semáforo ${f ? FAROL[f].toLowerCase() : 'sem avaliação'}"><i class="${f === 'vm' ? 'on vm' : ''}"></i><i class="${f === 'am' ? 'on am' : ''}"></i><i class="${f === 'vd' ? 'on vd' : ''}"></i></span>`;

  </section>`;
  const eqs = C.eqs.map(x => `<div class="eq click ${x.e.farol || ''}" data-ver="eq" data-id="${esc(x.e.id)}" role="button" tabindex="0" title="Ver o equipamento ${esc(x.e.nome)}">${sem(x.e.farol)}<div class="f"><h3>${esc(x.e.nome)}</h3>

  const insp = C.insp.map(i => `<tr class="click" data-ver="insp" data-id="${esc(i.id)}" tabindex="0" title="Ver os equipamentos de ${esc(i.nome)}"><td><b>${esc(i.nome)}</b><div class="hb"><i class="rr" style="width:${i.vmV / maxI * 100}%"></i><i class="y" style="width:${i.amV / maxI * 100}%"></i></div></td>

function ligar(app) {
  app.querySelectorAll('[data-area]').forEach(b => b.onclick = () => { S.area = b.dataset.area; ls.set('area', S.area); render(); });
  document.getElementById('bTela').onclick = () => {
    const d = document;
    try { if (d.fullscreenElement) d.exitFullscreen(); else d.documentElement.requestFullscreen().catch(() => { }); } catch (e) { }
  };
  const bv = document.getElementById('bVolta'); if (bv) bv.onclick = () => abrir(null);
  const bm = document.getElementById('bMapa'); if (bm) bm.onclick = () => abrir(S.ver && S.ver.t === 'mapa' ? null : { t: 'mapa' });
  const mi = document.getElementById('mInsp'); if (mi) mi.onchange = () => { S.mapaInsp = mi.value; render(); };
  app.querySelectorAll('[data-cel2]').forEach(el => el.onclick = () => { const [a, b] = el.dataset.cel2.split('|'); popCelula(calcular(), a, b); });
  app.querySelectorAll('[data-cel]').forEach(el => el.onclick = () => { const [a, b] = el.dataset.cel.split('|'); popCelula(calcular(), a, b); });
  app.querySelectorAll('[data-ver]').forEach(el => {
    el.onclick = ev => { ev.preventDefault(); abrir({ t: el.dataset.ver, id: el.dataset.id }); };
    el.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir({ t: el.dataset.ver, id: el.dataset.id }); } };
  });
}
/* abre a tela de um equipamento ou de um inspetor (o botão Voltar do navegador também volta) */
function abrir(v, semHist) {

}
window.addEventListener('popstate', ev => abrir(ev.state && ev.state.ver || null, true));

function vMapa(C) {
  const ids = C.insp.map(i => i.id).filter(id => C.I[id]).sort((a, b) => cmp(C.I[a].nome, C.I[b].nome));

  const grupos = sel.map(id => ({ i: C.I[id], eqs: C.eqs.filter(x => x.e.inspId === id).map(x => x.e).sort((a, b) => cmp(a.nome, b.nome)) })).filter(g => g.eqs.length);

  const linhas = MAPA.map((m, j) => {

    const nome = m.g === 'Correia' ? `${grp}<td class="ptn fx3">${esc(m.nome)}</td>` : `<td class="ptn fx2" colspan="2">${esc(m.nome)}</td>`;
    return `<tr><td class="n fx">${m.n}</td>${nome}${todos.map((x, k) => { const p = (x.e.partes || {})[m.k]; return `<td class="cel${ini(k)}" data-cel="${esc(x.e.id)}|${m.k}" title="${esc(x.e.nome)} · ${esc(m.nome)}">${ICF(p ? p.f : '')}</td>`; }).join('')}</tr>`;
  }).join('');
  const blocos = todos.length ? `<div class="mapa"><table><thead>${cab}</thead><tbody>${linhas}</tbody></table></div>` : '';
  return `<section class="det"><div class="f"><h2>Mapa de faróis</h2><div class="m">Farol de cada parte do transportador, marcado pelo inspetor na inspeção · clique numa célula para ver o comentário e a lista de inspeção</div></div></section>
  <div class="mapa-ctl"><label for="mInsp" style="color:var(--mut)">Inspetor</label><select id="mInsp"><option value="">Todos os inspetores</option>${ids.map(id => `<option value="${esc(id)}" ${S.mapaInsp === id ? 'selected' : ''}>${esc(C.I[id].nome)}</option>`).join('')}</select>
    <div class="leg"><span>${ICF('vd').replace('<svg', '<svg width="22" height="22"')} Bom</span><span>${ICF('am').replace('<svg', '<svg width="22" height="22"')} Atenção</span><span>${ICF('vm').replace('<svg', '<svg width="22" height="22"')} Crítico</span><span>${ICF('na').replace('<svg', '<svg width="22" height="22"')} Não se aplica</span><span>— sem avaliação</span></div></div>
  ${blocos || '<section class="pn"><div class="vazio">Nenhum equipamento para mostrar.</div></section>'}`;
}
function popCelula(C, eid, k) {
  const e = C.d.equip.find(x => x.id === eid); if (!e) return;
  const m = MAPA.find(x => x.k === k), x = (e.partes || {})[k], pk = /^r[345]$/.test(k) ? 'rolos' : k, p = PARTE[pk];
  const nc = x && p ? p.ck.filter((t, i) => (x.ck || {})[i] === 'nc') : [], cf = x && p ? p.ck.filter((t, i) => (x.ck || {})[i] === 'c').length : 0;
  const d = document.createElement('div'); d.className = 'pop';
  d.innerHTML = `<div class="cx"><button class="fe">Fechar</button><h3>${esc(e.nome)} · ${m.n} ${esc(m.nome)}</h3>
    ${x ? `<div style="display:flex;align-items:center;gap:10px;margin:8px 0">${ICF(x.f).replace('<svg', '<svg width="34" height="34"')}<b style="font-size:18px">${FAROL[x.f]}</b><span style="color:var(--mut)">· ${fData(x.em)} · ${esc(C.I[x.por] ? C.I[x.por].nome : '')}</span></div>
      ${x.c ? `<p><b>Comentário:</b> ${esc(x.c)}</p>` : '<p style="color:var(--mut)">Sem comentário.</p>'}
      ${p && p.ck.length ? `<p style="margin-bottom:0"><b>Lista de inspeção:</b> ${cf} conforme${cf === 1 ? '' : 's'}, ${nc.length} não conforme${nc.length === 1 ? '' : 's'}${p.ck.length - cf - nc.length ? ', ' + (p.ck.length - cf - nc.length) + ' sem resposta' : ''}</p>${nc.length ? `<ul>${nc.map(t => `<li style="color:#ff9b91">${esc(t)}</li>`).join('')}</ul>` : ''}` : ''}`
      : '<p style="color:var(--mut)">Esta parte ainda não foi avaliada neste equipamento.</p>'}
    <p style="margin-top:14px"><a href="#" data-eq="${esc(e.id)}" style="color:var(--az)">Abrir o equipamento ${esc(e.nome)}</a></p></div>`;
  d.onclick = ev => { if (ev.target === d || ev.target.classList.contains('fe')) d.remove(); };
  d.querySelector('[data-eq]').onclick = ev => { ev.preventDefault(); d.remove(); abrir({ t: 'eq', id: e.id }); };
  document.body.appendChild(d);
}

/* ----- telas individuais ----- */
const rotItem = r => r.pos === 'car' ? 'nº ' + r.cav : (r.cav || '—') + (r.aa ? ' AA' : '');
const aviso = (r, e) => /^p\d$/.test(r.pos) ? '<div class="av">Pesagem: retirar de operação e comunicar a instrumentação</div>' : r.zb ? '<div class="av am">Zona da balança: rolo específico para balança</div>' : (e && e.bal === 'dos' ? '<div class="av">Balança dosadora: troca crítica</div>' : '');
const nomeI = (C, id) => C.I[id] ? C.I[id].nome : '—';
function tabelaItens(C, e, l) {
  if (!l.length) return '<div class="vazio">Nenhum item pendente. Todos os rolos estão bons.</div>';
  l = l.slice().sort((a, b) => (C.vm(a) ? 0 : 1) - (C.vm(b) ? 0 : 1) || cmp(a.cav, b.cav) || ORDP.indexOf(a.pos) - ORDP.indexOf(b.pos));
  return `<table><thead><tr><th>${e.bal === 'dos' ? 'Nº' : 'Cavalete'}</th><th>Código</th><th>Situação</th><th>NI</th><th>Descrição</th><th>Observação</th><th>Marcado por</th><th class="n">Valor</th></tr></thead><tbody>
    ${l.map(r => { const t = C.T[r.tipoId]; return `<tr><td><b style="font-size:17px">${esc(rotItem(r))}</b></td><td><span class="cod" title="${esc(POSN[r.pos] || '')}">${esc(POS[r.pos] || r.pos)}</span></td>
      <td><span class="sit ${C.vm(r) ? 'vm' : 'am'}">${C.vm(r) ? 'Troca' : 'Atenção'}</span></td><td><b>${esc(t ? t.ni : '—')}</b></td>
      <td>${esc(t ? t.desc || CATN[t.cat] : '')}${aviso(r, e)}</td><td style="color:var(--mut)">${esc(r.obs || '')}</td>
      <td>${esc(nomeI(C, r.inspId))}<div style="font-size:12.5px;color:var(--mut)">${r.criadoEm ? fData(r.criadoEm) : ''}</div></td><td class="n">${brl(C.pr(r))}</td></tr>`; }).join('')}</tbody></table>`;
}
function compraDe(C, l) {
  const m = new Map();
  l.forEach(r => { if (!m.has(r.tipoId)) m.set(r.tipoId, { t: C.T[r.tipoId], vm: 0, am: 0 }); m.get(r.tipoId)[C.vm(r) ? 'vm' : 'am']++; });
  const x = [...m.values()]; if (!x.length) return '<div class="vazio">Nada a comprar.</div>';
  let qv = 0, qa = 0, tv = 0, ta = 0;
  return `<table><thead><tr><th>NI</th><th class="n">Troca</th><th class="n">Atenção</th><th class="n">Valor troca</th><th class="n">Troca + atenção</th></tr></thead><tbody>
    ${x.map(y => { const pu = y.t ? Number(y.t.preco) || 0 : 0; qv += y.vm; qa += y.am; tv += pu * y.vm; ta += pu * (y.vm + y.am); return `<tr><td><b>${esc(y.t ? y.t.ni : '—')}</b><div style="font-size:12.5px;color:var(--mut)">${esc(y.t ? y.t.desc || CATN[y.t.cat] : '')}</div></td><td class="n vmT"><b>${y.vm}</b></td><td class="n amT">${y.am}</td><td class="n">${brl(pu * y.vm)}</td><td class="n">${brl(pu * (y.vm + y.am))}</td></tr>`; }).join('')}
    <tr class="tt"><td>Total</td><td class="n vmT">${qv}</td><td class="n amT">${qa}</td><td class="n">${brl(tv)}</td><td class="n">${brl(ta)}</td></tr></tbody></table>`;
}
const tagBal = e => e.bal === 'dos' ? '<span class="tag dos">Balança dosadora</span>' : e.bal === 'tem' ? '<span class="tag">Com balança</span>' : '';
const roletesTxt = (e, x) => e.bal === 'dos' ? '3 de pesagem + ' + nf(e.ncav) + ' de carga = ' + nf(x.total) + ' rolos' : nf(e.ncav) + ' cavaletes · ' + nf(e.nret) + ' de retorno · ' + nf(x.total) + ' rolos';
const farolTxt = (C, e) => e.farol ? FAROL[e.farol] + ' · avaliado em ' + fData(e.farolEm) + (e.farolPor ? ' por ' + nomeI(C, e.farolPor) : '') : 'Semáforo sem avaliação';
function vEquip(C, id) {
  const x = C.eqs.find(y => y.e.id === id); if (!x) return '';
  const e = x.e, l = C.at.filter(r => r.equipId === id), i = C.I[e.inspId];
  const tr = C.d.rol.filter(r => r.equipId === id && r.status === 'trocado' && (r.trocadoEm || 0) > Date.now() - 30 * 864e5).length;
  return `<section class="det">${sem(e.farol)}<div class="f"><h2>${esc(e.nome)} ${tagBal(e)}</h2>
      <div class="m">${esc(e.area || '')}${e.area ? ' · ' : ''}Inspetor: ${i ? `<a href="#" data-ver="insp" data-id="${esc(e.inspId)}" style="color:var(--az)">${esc(i.nome)}</a>` : '—'}${S.area === 'todas' && i ? ' · ' + esc(AREAS[i.area] || '') : ''} · ${esc(roletesTxt(e, x))}</div>
      <div class="m">${esc(farolTxt(C, e))}</div></div></section>
  <section class="kpis">
    <div class="k"><div class="r"><i style="background:var(--vd)"></i>Rolos bons</div><b>${x.total ? pt(pct(x.bons, x.total)) : '—'}</b>${x.total ? barra(x) : ''}<div class="s">${nf(x.bons)} de ${nf(x.total)}</div></div>
    <div class="k"><div class="r"><i style="background:var(--vm)"></i>Para troca</div><b class="vmT">${nf(x.vmN)}</b><div class="v">${brl(x.vmV)}</div><div class="s">${pt(pct(x.vmU, x.total))} dos rolos</div></div>
    <div class="k"><div class="r"><i style="background:var(--am)"></i>Em atenção</div><b class="amT">${nf(x.amN)}</b><div class="v">${brl(x.amV)}</div><div class="s">${pt(pct(x.amU, x.total))} dos rolos</div></div>
    <div class="k"><div class="r"><i style="background:var(--az)"></i>Investimento para zerar</div><b style="font-size:clamp(26px,2.6vw,42px)">${brlC(x.vmV + x.amV)}</b><div class="s">troca + atenção</div></div>
    <div class="k"><div class="r"><i style="background:#9fb4c6"></i>Trocados em 30 dias</div><b>${nf(tr)}</b><div class="s">baixas neste equipamento</div></div>
  </section>
  <div class="grid">
    <section class="pn"><div class="pt"><h2>Itens pendentes</h2><span>${pl(l.length, 'item', 'itens')} · troca primeiro</span></div>${tabelaItens(C, e, l)}</section>
    <div><section class="pn"><div class="pt"><h2>Farol das partes</h2><span>marcado pelo inspetor</span></div>
      <table><tbody>${MAPA.map(m => { const x = (e.partes || {})[m.k]; return `<tr class="click" data-cel2="${esc(e.id)}|${m.k}"><td style="width:34px;color:var(--mut)">${m.n}</td><td><b>${esc(m.nome)}</b>${x && x.c ? `<div style="font-size:12.5px;color:var(--mut)">${esc(x.c)}</div>` : ''}</td><td style="width:40px">${ICF(x ? x.f : '').replace('<svg', '<svg width="28" height="28"')}</td></tr>`; }).join('')}</tbody></table></section>
    <section class="pn"><div class="pt"><h2>Lista de compras do equipamento</h2></div>${compraDe(C, l)}</section></div>
  </div>`;
}
function vInsp(C, id) {
  const i = C.I[id]; if (!i) return '';
  const meus = C.eqs.filter(x => x.e.inspId === id), l = C.at.filter(r => C.eqs.some(x => x.e.id === r.equipId && x.e.inspId === id));
  const g = C.novo(); l.forEach(r => C.soma(g, r));
  const tot = meus.reduce((s, x) => s + x.total, 0), bons = meus.reduce((s, x) => s + x.bons, 0);
  const far = { vd: 0, am: 0, vm: 0, x: 0 }; meus.forEach(x => { far[FAROL[x.e.farol] ? x.e.farol : 'x']++; });
  const cards = meus.map(x => { const e = x.e, li = l.filter(r => r.equipId === e.id);
    return `<section class="pn eqd"><div class="cab">${sem(e.farol)}<div class="f"><h3><a href="#" data-ver="eq" data-id="${esc(e.id)}" style="color:inherit;text-decoration:none">${esc(e.nome)}</a> ${tagBal(e)}</h3>
        <div class="m" style="color:var(--mut);font-size:14px">${esc(e.area || '')}${e.area ? ' · ' : ''}${esc(roletesTxt(e, x))} · ${esc(farolTxt(C, e))}</div>${barra(x)}</div>
        <div class="mini"><span>Bons <b>${x.total ? pt(pct(x.bons, x.total)) : '—'}</b></span><span>Troca <b class="vmT">${x.vmN}</b> · ${brl(x.vmV)}</span><span>Atenção <b class="amT">${x.amN}</b> · ${brl(x.amV)}</span></div></div>
      ${tabelaItens(C, e, li)}</section>`; }).join('');
  return `<section class="det"><div class="f"><h2>${esc(i.nome)}</h2><div class="m">${i.matricula ? 'Matrícula ' + esc(i.matricula) + ' · ' : ''}${esc(AREAS[i.area] || '')} · ${pl(meus.length, 'equipamento', 'equipamentos')}</div></div>
      <div class="cont" style="margin:0"><div><i style="background:var(--vd)"></i><b>${far.vd}</b> ${far.vd === 1 ? 'bom' : 'bons'}</div><div><i style="background:var(--am)"></i><b>${far.am}</b> em atenção</div><div><i style="background:var(--vm)"></i><b>${far.vm}</b> ${far.vm === 1 ? 'crítico' : 'críticos'}</div><div><i style="background:var(--cz)"></i><b>${far.x}</b> sem avaliação</div></div></section>
  <section class="kpis">
    <div class="k"><div class="r"><i style="background:var(--vd)"></i>Rolos bons</div><b>${tot ? pt(pct(bons, tot)) : '—'}</b>${tot ? barra({ total: tot, amU: g.amU, vmU: g.vmU }) : ''}<div class="s">${nf(tot)} rolos nos equipamentos dele</div></div>
    <div class="k"><div class="r"><i style="background:var(--vm)"></i>Para troca</div><b class="vmT">${nf(g.vmN)}</b><div class="v">${brl(g.vmV)}</div><div class="s">itens vermelhos</div></div>
    <div class="k"><div class="r"><i style="background:var(--am)"></i>Em atenção</div><b class="amT">${nf(g.amN)}</b><div class="v">${brl(g.amV)}</div><div class="s">itens amarelos</div></div>
    <div class="k"><div class="r"><i style="background:var(--az)"></i>Investimento para zerar</div><b style="font-size:clamp(26px,2.6vw,42px)">${brlC(g.vmV + g.amV)}</b><div class="s">troca + atenção</div></div>
    <div class="k"><div class="r"><i style="background:#9fb4c6"></i>Equipamentos</div><b>${nf(meus.length)}</b><div class="s">clique no nome para ver só um</div></div>
  </section>
  ${cards || '<section class="pn"><div class="vazio">Este inspetor ainda não tem equipamentos cadastrados.</div></section>'}
  <section class="pn" style="margin-top:18px"><div class="pt"><h2>Lista de compras dos equipamentos dele</h2></div>${compraDe(C, l)}</section>`;
}
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get('s')) { S.srv = q.get('s'); ls.set('srv', S.srv); }
  if (q.get('e')) { S.codigo = q.get('e'); ls.set('codigo', S.codigo); }
  if (q.get('a') && (AREAS[q.get('a')] || q.get('a') === 'todas')) { S.area = q.get('a'); ls.set('area', S.area); }
  if (q.get('s') || q.get('e')) history.replaceState(null, '', location.pathname);
  render(); carregar();
  setInterval(carregar, 60000);
  setInterval(() => { const el = document.getElementById('relogio'), d = new Date(); if (el) el.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes()); }, 15000);
})();
</script>
</body>
</html>
