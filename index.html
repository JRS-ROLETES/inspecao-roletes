<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inspeção de Rolos</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#132331">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Grafite e aço: topo escuro com os números principais; superfícies claras e quietas no resto. */
:root{color-scheme:light;
--ink:#132331;--ink2:#1c3245;--az:#1d5a8c;--az2:#3a86c4;--azc:#e6eff7;
--bg:#eef1f4;--card:#ffffff;--tx:#15212c;--mut:#5f6e7b;--ln:#dde3e9;--ln2:#eaeef2;
--vm:#c62828;--vmc:#fdeceb;--am:#e0a100;--amt:#7f5b00;--amc:#fff5d9;--vd:#2e7d32;--vdc:#e7f4e8;
--f:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
--sh:0 1px 2px rgba(19,35,49,.06),0 6px 20px rgba(19,35,49,.06);--r:16px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--f);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;font-stretch:112%;letter-spacing:-.01em;text-wrap:balance}
:focus-visible{outline:3px solid var(--az2);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-size:12px;opacity:.65;font-weight:400;font-stretch:100%;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.st{border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:5px 11px;font-size:12px;background:rgba(255,255,255,.06);color:#d6e2ec;white-space:nowrap;cursor:pointer}
.st.off{background:#f5b301;border-color:#f5b301;color:#3b2a00;font-weight:600}
.cta{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;border-radius:99px;padding:5px 12px 5px 7px;font-size:12px;cursor:pointer}
.cta svg{width:18px;height:18px}
main{padding:16px 16px calc(110px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
/* topo estendido: a única área escura e marcante */
.hero{background:var(--ink);color:#fff;margin:-16px -16px 18px;padding:6px 18px 22px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.035);pointer-events:none}
.hero h2{font-size:24px;font-weight:700;font-stretch:118%}
.hero .hs{color:#9fb4c6;font-size:14px;margin-top:3px}
.hero .row{position:relative;z-index:1}
.hk{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.1);border-radius:14px;overflow:hidden;margin-top:18px;position:relative;z-index:1}
.hk>div{background:var(--ink2);padding:12px 12px 11px;min-width:0}
.hk b{display:block;font-size:26px;line-height:1.05;font-weight:800;font-stretch:118%}
.hk span{display:flex;align-items:center;gap:6px;font-size:12px;color:#a9bccc;margin-top:4px}
.hk i{display:block;font-style:normal;font-size:12.5px;color:#e3ebf2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .btn.cl{margin-top:16px;position:relative;z-index:1}
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;max-width:560px;margin:0 auto;background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border:1px solid rgba(19,35,49,.08);border-radius:22px;box-shadow:0 10px 30px rgba(19,35,49,.16);display:flex;padding:5px}
.nav button{flex:1;border:0;background:none;padding:7px 2px 6px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:16px;cursor:pointer}
.nav button.on{color:var(--az);background:var(--azc);font-weight:700}
.nav svg{width:23px;height:23px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:18px;margin-bottom:10px;font-weight:700}
.card h3{font-size:15px;margin-bottom:8px;font-weight:700}
.mut{color:var(--mut);font-size:14px}
.sm{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.row>.f{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:650;background:var(--az);color:#fff;min-height:48px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(19,35,49,.18);text-decoration:none;transition:transform .08s ease,filter .15s ease}
.btn:active{transform:translateY(1px);filter:brightness(.96)}
.btn.w{width:100%}
.btn svg{width:20px;height:20px;flex:none}
.btn.sec{background:var(--azc);color:var(--az);box-shadow:none}
.btn.lin{background:#fff;color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--ln)}
.btn.cl{background:#fff;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.btn.vm{background:var(--vm)}
.btn.am{background:var(--am);color:#2b1f00}
.btn.vd{background:var(--vd)}
.btn.peq{min-height:36px;padding:7px 13px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.42;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
label.l{display:block;font-size:14px;font-weight:650;margin:14px 0 6px}
label.l:first-child{margin-top:0}
.in{width:100%;border:1.5px solid var(--ln);border-radius:12px;padding:11px 13px;background:#fbfcfd;min-height:48px;transition:border-color .15s,box-shadow .15s}
.in:focus{outline:none;border-color:var(--az2);background:#fff;box-shadow:0 0 0 4px rgba(58,134,196,.15)}
.dica{font-size:13px;color:var(--mut);margin-top:5px}
.tabs{display:flex;background:#e2e7ec;border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-size:14px;font-weight:650;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(19,35,49,.12)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);min-width:0}
.kpi span{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.kpi span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--az2);flex:none}
.kpi.vm span::before{background:var(--vm)}.kpi.am span::before{background:var(--am)}.kpi.vd span::before{background:var(--vd)}
.kpi b{display:block;font-size:28px;line-height:1.1;font-weight:800;font-stretch:118%;margin-top:6px}
.kpi i{display:block;font-style:normal;font-weight:600;font-size:15px;margin-top:2px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln2)}
.li:first-of-type{border-top:0}
.li .f{flex:1;min-width:0}
.li b{display:block;font-weight:650}
.tap{cursor:pointer}
.li.tap:active{background:var(--ln2)}
.chip{display:inline-block;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.vm{background:var(--vmc);color:var(--vm)}
.chip.am{background:var(--amc);color:var(--amt)}
.chip.vd{background:var(--vdc);color:var(--vd)}
.chip.az{background:var(--azc);color:var(--az)}
.cod{display:inline-block;min-width:46px;text-align:center;font-weight:800;border-radius:7px;padding:3px 6px;background:var(--ink);color:#fff;font-size:13px;font-stretch:110%;letter-spacing:.02em}
.vazio{text-align:center;color:var(--mut);padding:20px 8px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--ln2);margin:8px 0 5px}
.bar i{display:block;height:100%}
.bar .g{background:var(--vd)}.bar .y{background:var(--am)}.bar .r{background:var(--vm)}.bar .b{background:var(--az2)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.cavbox{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:8px}
.cavbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.pz{cursor:pointer}
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper .in{text-align:center;font-size:26px;font-weight:800;font-stretch:118%}
.stepper button{width:58px;border:0;border-radius:12px;background:var(--azc);color:var(--az);font-size:28px;font-weight:700;cursor:pointer}
.nivel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nivel button{border:1.5px solid var(--ln);background:#fff;border-radius:14px;padding:11px 10px;text-align:left;min-height:66px;cursor:pointer}
.nivel button b{display:flex;align-items:center;gap:7px;font-size:15px}
.nivel button span{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.nivel button.on.vm{border-color:var(--vm);background:var(--vmc);box-shadow:0 0 0 3px rgba(198,40,40,.12)}
.nivel button.on.am{border-color:var(--am);background:var(--amc);box-shadow:0 0 0 3px rgba(224,161,0,.16)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.vm{background:var(--vm)}.dot.am{background:var(--am)}
.cavtog{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;border:1.5px dashed #c6cfd8;background:#fff;border-radius:14px;padding:11px 13px;text-align:left;cursor:pointer}
.cavtog.on.vm{border:1.5px solid var(--vm);background:var(--vmc)}
.cavtog.on.am{border:1.5px solid var(--am);background:var(--amc)}
.cavtog.ex{border-style:solid;opacity:.9}
.chip.na{background:#dbe9fb;color:#1557b0;font-weight:800}
.btn.na,.btn.na:hover{background:#1f6fd6;color:#fff}
.nabox{display:flex;gap:12px;align-items:center;background:#eef5fe;border:1.5px dashed #1f6fd6;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.nabox .f{font-size:14px;color:#1f3b63}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:50%;background:#1f5c8b;color:#fff;font-weight:800;font-size:14px;flex:none}
.num.g{min-width:44px;height:44px;font-size:18px}
.ckl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.ckl .f{flex:1 1 200px;font-size:15px}
.ckb{display:flex;gap:6px}
.ckb button{border:1.5px solid var(--ln);background:#fff;border-radius:10px;padding:8px 11px;font-size:13.5px;font-weight:650;cursor:pointer;color:var(--tx)}
.ckb button.on.c{background:var(--vd);border-color:var(--vd);color:#fff}
.ckb button.on.nc{background:var(--vm);border-color:var(--vm);color:#fff}
textarea.in{resize:vertical;min-height:80px;font:inherit}
.cavtog.on.aa{border:1.5px solid #1f5c8b;background:#e4eef7}
.aviso{background:var(--amc);color:#5a4200;border-radius:12px;padding:11px 13px;font-size:14px;margin:8px 0}
.alerta{background:var(--vmc);color:#7a1010;border:1.5px solid var(--vm);border-radius:12px;padding:11px 13px;font-size:14px;margin:8px 0;line-height:1.4}
.aviso.sm,.alerta.sm{font-size:12.5px;padding:7px 10px;margin:5px 0 0}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;background:#e4eef7;color:#1f5c8b;vertical-align:middle}
.tag.dos{background:#fff3c4;color:#6b4e00}
.nivel button[disabled]{opacity:.35;cursor:not-allowed}
.dosch{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.dosch button{border:1.5px solid var(--ln);background:#fff;border-radius:12px;padding:9px 6px;font-size:14px;font-weight:700;cursor:pointer;text-align:center}
.dosch button small{display:block;font-weight:500;font-size:11.5px;color:var(--mut)}
.dosch button.pes{border-color:#e0b400;background:#fffaf0}
.dosch button.on{background:var(--vm);border-color:var(--vm);color:#fff}.dosch button.on small{color:#fde}
.dosch button.ex{border-style:dashed;border-color:var(--vm);color:var(--vm)}
.erro{background:var(--vmc);color:#8e1c1c;border-radius:12px;padding:11px 13px;font-size:14px;margin:8px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:650;padding:7px 6px;border-bottom:1.5px solid var(--ln)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--ln2);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.chk{width:22px;height:22px;border:2px solid #9aa7b3;border-radius:5px;display:inline-block}
.sel{display:flex;flex-wrap:wrap;gap:7px}
.sel button{border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer}
.sel button.on{background:var(--ink);border-color:var(--ink);color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal .fundo{position:absolute;inset:0;background:rgba(10,20,30,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modal .caixa{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
#modal .caixa::before{content:"";display:block;width:40px;height:5px;border-radius:99px;background:var(--ln);margin:0 auto 12px}
#modal .cab{display:flex;align-items:center;gap:8px;margin-bottom:14px}
#modal .cab h2{flex:1;font-size:19px}
.x{border:0;background:var(--ln2);border-radius:50%;width:36px;height:36px;font-size:20px;line-height:1;cursor:pointer}
.ent{max-width:440px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) 16px 30px}
.logo{text-align:center;margin-bottom:20px}
.logo img{width:76px;height:76px;border-radius:20px;box-shadow:var(--sh)}
.logo h1{font-size:24px;margin-top:10px;font-stretch:118%}
.print-only{display:none}
.det summary{cursor:pointer;font-weight:650;padding:4px 0}
.opc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--r);padding:15px 16px;margin-bottom:12px;cursor:pointer;box-shadow:var(--sh)}
.opc .ic{flex:none;width:46px;height:46px;border-radius:13px;background:var(--azc);color:var(--az);display:flex;align-items:center;justify-content:center}
.opc .ic svg{width:24px;height:24px}
.opc b{display:block;font-size:16px;font-weight:700}
.opc small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.opc::after{content:"›";margin-left:auto;font-size:24px;color:#a5b1bc;line-height:1}
.opc.prim{background:#fff;color:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.opc.prim .ic{background:var(--ink);color:#fff}
.opc.prim small{color:var(--mut)}
.voltar{border:0;background:none;color:var(--az);font-weight:650;padding:6px 0;margin-bottom:8px;font-size:15px;cursor:pointer}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#2a5f8a,#173246);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;font-stretch:110%;letter-spacing:.02em}
.av.lg{width:56px;height:56px;font-size:20px;background:linear-gradient(145deg,#3a86c4,#1d5a8c);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;position:relative;z-index:1}
.area{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid rgba(255,255,255,.14);background:var(--ink2);color:#fff;border-radius:18px;padding:18px 16px 16px;min-height:150px;cursor:pointer;transition:transform .08s ease,background .15s}
.area:active{transform:scale(.98);background:#24405a}
.area-n{font-size:32px;font-weight:800;font-stretch:125%;line-height:1;letter-spacing:-.01em}
.area-s{font-size:13px;color:#a9bccc}
.area-c{margin-top:auto;font-size:12.5px;color:#e3ebf2;background:rgba(255,255,255,.08);border-radius:99px;padding:4px 10px}
.dev{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.dev .dk{font-size:12px;color:var(--mut)}
.dev b{display:block;font-size:16px;font-weight:700;margin-top:1px}
.dev .btn{margin-top:14px}
.btn.wa{background:#1f9d55}
.sem{display:inline-flex;flex-direction:column;gap:3px;background:var(--ink);padding:4px;border-radius:9px;flex:none}
.sem i{display:block;width:10px;height:10px;border-radius:50%;background:#3a4b5a}
.sem.g{padding:6px;border-radius:13px;gap:5px}.sem.g i{width:16px;height:16px}
.sem i.on.vd{background:#43c463;box-shadow:0 0 8px #43c463}.sem i.on.am{background:#f5c02b;box-shadow:0 0 8px #f5c02b}.sem i.on.vm{background:#ef4a3c;box-shadow:0 0 8px #ef4a3c}
.farois{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.farois button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--ln);background:#fff;border-radius:14px;padding:12px 6px;cursor:pointer;text-align:center}
.farois button b{font-size:14px}
.farois button small{font-size:11.5px;color:var(--mut);line-height:1.25}
.farois .lz{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 -3px 6px rgba(0,0,0,.18)}
.farois .vd .lz{background:#2e9e4b}.farois .am .lz{background:#e0a100}.farois .vm .lz{background:#d23a2e}
.farois button.on.vd{border-color:var(--vd);background:var(--vdc);box-shadow:0 0 0 3px rgba(46,125,50,.14)}
.farois button.on.am{border-color:var(--am);background:var(--amc);box-shadow:0 0 0 3px rgba(224,161,0,.16)}
.farois button.on.vm{border-color:var(--vm);background:var(--vmc);box-shadow:0 0 0 3px rgba(198,40,40,.12)}
.fsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.fsum>div{background:var(--card);border-radius:14px;padding:11px 8px;text-align:center;box-shadow:var(--sh)}
.fsum b{display:block;font-size:24px;font-weight:800;font-stretch:118%;line-height:1.1}
.fsum span{font-size:12px;color:var(--mut)}
.fsum .dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:0}
.tot{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.tot>b{font-weight:700;font-size:16px}
.tot .ts{font-size:12.5px;color:#a9bccc;margin-top:2px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.1);border-radius:12px;overflow:hidden;margin:12px 0}
.tg>div{background:var(--ink2);padding:10px;min-width:0}
.tg span{display:block;font-size:11.5px;color:#a9bccc}
.tg b{display:block;font-size:22px;font-weight:800;font-stretch:118%;line-height:1.15}
.tg i{display:block;font-style:normal;font-size:12px;color:#e3ebf2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot .btn.cl{flex:3 1 200px}.tot .btn.wa{flex:1 1 90px}
.sec-t{display:flex;align-items:center;gap:10px;margin:22px 2px 10px}

/* ===== servidor ===== */
async function api(p, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 30000);
  try {
    const r = await fetch(S.srv, { method: 'POST', body: JSON.stringify(p), signal: ctl.signal, redirect: 'follow' });
    return await r.json();
  } finally { clearTimeout(t); }
}
let _agendado = 0;
async function sincronizar(silencioso) {
  if (S.enviando || !S.codigo || !S.srv) return;
  S.enviando = true; render(true);
  let mais = false;
  try {
    let r;
    if (S.fila.length) {
      const lote = S.fila.slice(0, 40);
      r = await api({ action: 'ops', codigo: S.codigo, ops: lote });
      if (r.ok) {
        const ids = new Set(lote.map(o => o.oid));
        S.fila = S.fila.filter(o => !ids.has(o.oid)); ls.set('fila', S.fila);
        const ruins = (r.res || []).filter(x => !x.ok);
        if (ruins.length) toast('Não foi gravado: ' + [...new Set(ruins.map(x => msg(x.erro)))].join(' '), 6000);
        mais = S.fila.length > 0;
      }
    } else r = await api({ action: 'sync', codigo: S.codigo });
    if (!r.ok) {
      if (r.erro === 'codigo-equipe') { sairLocal(msg('codigo-equipe')); return; }
      throw new Error(r.erro);
    }
    receber(r);
    S.online = true;
    if (!mais) setTimeout(enviarEmails, 50);
  } catch (e) {
    S.online = false;
    if (!silencioso && navigator.onLine) toast('Não foi possível falar com o servidor. Os dados ficam guardados no aparelho.');
  } finally {
    S.enviando = false; render(true);
    if (mais) setTimeout(() => sincronizar(true), 100);
  }
}

  ops.forEach(o => { o.oid = o.oid || uid(); o.por = o.por || (S.eu ? S.eu.id : 'equipe'); S.fila.push(o); });
  ls.set('fila', S.fila); mudou(); render();
  clearTimeout(_agendado); _agendado = setTimeout(() => sincronizar(true), 300);
}
function sairLocal(aviso) {
  S.codigo = ''; S.eu = null; S.area = ''; S.base = null; S.fila = []; V.insp = null; S.admin = false;
  ['codigo', 'admin', 'area', 'base', 'fila', 'sync', 'listaSel'].forEach(k => ls.del(k));
  mudou(); fecharModal(); V.tela = 'inicio'; V.fora = 'lista'; render();

const precoDe = (D, r) => { const t = D.tipo[r.tipoId]; return t ? Number(t.preco) || 0 : 0; };

  const k = vm(r) ? 'vm' : 'am', p = precoDe(D, r);

/* ----- Inspeção ----- */
function estadoCav(D, equipId, cav) {
  const est = {}, ex = {};
  if (!cav) return { est, ex };
  itensAtivos(D).filter(r => r.equipId === equipId && r.cav === cav).forEach(r => {
    ex[r.pos] = r;
    est[r.pos] = { m: vm(r) ? 'vm' : 'am', s: 'ex' };
    if (r.pos === 'cav') CARGA.forEach(p => { if (!est[p]) est[p] = { m: vm(r) ? 'vm' : 'am', s: 'ex' }; });
  });
  return { est, ex };
}
const padraoDe = e => ({ carga: e.tipoCarga, retorno: e.tipoRetorno, cavalete: e.tipoCav, balanca: e.tipoBal, guia: e.tipoGuia });
function blocoTipos(D, e, I, cats) {
  const padrao = padraoDe(e);
  return cats.map(c => {
    const l = tiposCat(D, c), v = (I.tipo && I.tipo[c]) || padrao[c] || (l.length === 1 ? l[0].id : '');
    return `<label class="l">${CATN[c]} (NI)</label>
    ${l.length ? `<select class="in" data-k="tipo" data-c="${c}"><option value="">Escolha o NI…</option>${l.map(t => `<option value="${t.id}" ${t.id === v ? 'selected' : ''}>${esc(tipoTxt(t))} · ${brl(t.preco)}</option>`).join('')}</select>` : `<div class="aviso">Nenhum tipo de ${CATN[c].toLowerCase()} cadastrado.</div>`}
    <button type="button" class="btn sec peq" style="margin-top:6px" data-a="novoTipo" data-c="${c}">+ Cadastrar ${CATN[c].toLowerCase()}</button>`;
  }).join('');
}
/* semáforo dos rolos: impacto, carga e retorno (na dosadora, um só) */
const rolosDe = e => ehDos(e) ? [['r4', 'Rolos da balança dosadora']] : ROLOS3;
function blocoFarolInsp(D, e, I) {
  const far = I.far || {}, P = e.partes || {};
  const trav = farolTravado(D, e) ? `<div class="alerta" style="margin-top:0">Semáforo geral do equipamento travado em vermelho: ${ehDos(e) ? 'balança dosadora com rolo para troca' : 'rolo da zona da balança para troca'}. Libera quando os itens forem trocados.</div>` : '';
  return trav + rolosDe(e).map(([k, n]) => `<div style="margin-top:10px"><b>${n}</b>${!far[k] && P[k] ? ` <span class="mut sm">· última: ${FAROL[P[k].f].n.toLowerCase()}, ${fData(P[k].em)}</span>` : ''}
    ${blocoFarol(far[k] || '', 'farolRolo', k)}
    <button type="button" class="btn ${far[k] === 'na' ? 'na' : 'sec'} peq" style="margin-top:6px" data-a="farolRolo" data-k="${k}" data-v="na">${far[k] === 'na' ? '✓ ' : ''}Não se aplica (esta correia não tem ${n.toLowerCase()})</button></div>`).join('');
}
function blocoFarolInspAntigo(D, e, I) {
  if (farolTravado(D, e)) return `<div class="row" style="gap:12px">${semaforo('vm', 1)}<div class="f"><b>Vermelho · situação crítica</b><div class="mut sm">Travado automaticamente: ${ehDos(e) ? 'balança dosadora com rolo para troca' : 'rolo da zona da balança para troca'}. Libera quando os itens forem trocados.</div></div></div>`;
  return `${blocoFarol(I.farol || '', 'farolInsp')}
    ${!I.farol && e.farol ? `<div class="dica">Última avaliação: ${FAROL[e.farol].n.toLowerCase()}, em ${fData(e.farolEm)} por ${esc(nomeInsp(D, e.farolPor))}.</div>` : ''}`;
}
function rodapeInsp(D, e, I) {
  const nesta = (I.ids || []).map(id => D.rol[id]).filter(Boolean).sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
  const outros = itensAtivos(D).filter(r => r.equipId === e.id && !(I.ids || []).includes(r.id)).sort(ordItem);
  return `<div class="card"><h3>Registrados nesta inspeção (${nesta.length})</h3>
    ${nesta.length ? nesta.map(r => linhaItem(D, r, true)).join('') : '<div class="mut">Nada registrado ainda.</div>'}</div>
  ${outros.length ? `<details class="card det"><summary>Já marcados antes neste equipamento (${outros.length})</summary>${outros.map(r => linhaItem(D, r, false)).join('')}</details>` : ''}
  <button class="btn w vd" data-a="concluirRolos" style="margin-bottom:8px">Concluir rolos e voltar às partes</button>
  <button class="btn w sec" data-a="partes">Voltar às partes sem concluir</button>`;
}
function estadoDos(D, equipId) {
  const est = {}, ex = {};
  const car = [];
  itensAtivos(D).filter(r => r.equipId === equipId && DOS.includes(r.pos)).forEach(r => {
    if (r.pos === 'car') { car.push(r); return; }

function adicionar() {
  const I = V.insp, D = dados(), e = D.equip[I.equipId], dos = ehDos(e), cav = dos ? '' : normCav(I.cav);
  if (!e || (!dos && !cav) || !(I.sel || []).length) return;
  const zb = !dos && e.bal === 'tem' && !!I.zb, nivel = (dos || zb) ? 'vm' : I.nivel;
  const aaOn = !dos && (!!I.aa || itensAtivos(D).some(r => r.equipId === e.id && r.cav === cav && r.aa));
  const padrao = padraoDe(e);
  const ops = [], faltam = [];
  for (const p of I.sel) {
    if (dos !== DOS.includes(p)) continue;
    const c = catDe(p, zb), l = tiposCat(D, c), tipoId = (I.tipo && I.tipo[c]) || padrao[c] || (l.length === 1 ? l[0].id : '');
    if (!tipoId || !D.tipo[tipoId] || D.tipo[tipoId].cat !== c) { faltam.push(CATN[c]); continue; }
    const d = { equipId: e.id, cav: p === 'car' ? normCav(I.ncar) : cav, pos: p, nivel, tipoId, obs: (I.obs || '').trim(), inspId: S.eu.id, status: 'pendente', criadoEm: Date.now() };
    if (p === 'car') {
      if (!d.cav) { toast('Digite o número do rolo de carga.'); return; }
      if (itensAtivos(D).some(r => r.equipId === e.id && r.pos === 'car' && r.cav === d.cav)) { toast('O rolo de carga nº ' + d.cav + ' já está marcado.'); return; }
    }
    if (zb) d.zb = true;
    if (aaOn) d.aa = true;
    ops.push({ c: 'rol', t: 'add', id: uid(), d });
  }
  if (faltam.length) { toast('Escolha o NI: ' + [...new Set(faltam)].join(', ') + '.', 4500); return; }
  if (!ops.length) return;
  const pes = ops.some(o => ehPes(o.d.pos));
  const fazer = () => {
    I.ids = (I.ids || []).concat(ops.map(o => o.id)); I.sel = []; I.obs = ''; I.zb = false; I.ncar = ''; if (aaOn) { I.aa = true; I.aaCav = cav; } salvarInsp();
    enfileirar(ops);
    // balança: o semáforo do equipamento vai automaticamente para vermelho
    if (dos || zb) setFarolRolo('r4', 'vm', true);
    const q = ops.length + (ops.length > 1 ? ' itens registrados' : ' item registrado');
    if (pes) abrirModal('Rolo de pesagem', `<div class="alerta" style="font-size:16px;margin-top:0"><b>Retire o equipamento de operação</b> e <b>comunique a instrumentação</b> para acompanhar a troca do rolo de pesagem.</div>
      <p class="mut">${esc(e.nome)} · ${ops.filter(o => ehPes(o.d.pos)).map(o => POS[o.d.pos]).join(', ')} na lista de troca (crítico). Semáforo do equipamento em vermelho.</p>
      <button class="btn w" data-a="fechar">Entendi</button>`);
    else if (dos) toast(q + ' para troca (crítico). Semáforo em vermelho.', 4500);
    else if (zb) toast(q + ' no cavalete ' + cav + '. Use rolo específico para balança. Semáforo em vermelho.', 5000);
    else toast(q + ' no cavalete ' + cav + (nivel === 'vm' ? ' (troca).' : ' (atenção).'));
  };
  if (I.sel.includes('cav')) {
    const subs = itensAtivos(D).filter(r => r.equipId === e.id && r.cav === cav && CARGA.includes(r.pos));
    if (subs.length) { confirmar('Cavalete completo', `O cavalete ${esc(cav)} já tem ${subs.map(r => POS[r.pos]).join(', ')} marcado(s). Eles serão substituídos pelo cavalete completo.`, fazer, 'Continuar'); return; }
  }
  fazer();
}

      S.codigo = c; ls.set('codigo', c); receber(r); S.online = true; V.fora = 'lista'; render();
    } catch (e) { toast('Sem conexão com o servidor.', 5000); }
    finally { if (b.isConnected) b.disabled = false; }
  },
  async cadastroInsp(f) {
    const nome = f.nome.value.trim().replace(/\s+/g, ' '), mat = f.matricula.value.trim(), email = f.email.value.trim().toLowerCase();
    if (nome.length < 3) return erroForm(msg('nome-invalido'));
    if (!EMAIL_RE.test(email)) return erroForm(msg('email-invalido'));
    if (Object.values(dados().insp).some(i => chave(i.nome) === chave(nome))) return erroForm(msg('nome-existe'));
    const b = f.querySelector('button'); b.disabled = true;
    try {
      const r = await api({ action: 'cadastro', codigo: S.codigo, nome, matricula: mat, area: S.area, email });
      if (!r.ok) return erroForm(msg(r.erro));
      receber(r); S.online = true;
      escolherInsp(r.inspId);
      toast('Cadastro feito. Agora cadastre o seu primeiro equipamento.', 5000);
      mEquip(null);
    } catch (e) { erroForm('Sem internet. O cadastro do inspetor precisa de conexão; tente de novo com sinal.'); }
    finally { if (b.isConnected) b.disabled = false; }
  },
  async meuEmail(f) {
    const email = f.email.value.trim().toLowerCase();
    if (!EMAIL_RE.test(email)) return erroForm(msg('email-invalido'));
    const b = f.querySelector('button'); b.disabled = true;
    try {
      const r = await api({ action: 'meuEmail', codigo: S.codigo, inspId: S.eu.id, email });
      if (!r.ok) return erroForm(msg(r.erro));
      receber(r); fecharModal(); render(); toast('E-mail salvo. Os próximos relatórios chegam nele.', 4500);
    } catch (e) { erroForm('Sem internet. Tente de novo com sinal.'); }
    finally { if (b.isConnected) b.disabled = false; }
  },
  async inspEditar(f) {
    if (f.email.value.trim() && !EMAIL_RE.test(f.email.value.trim())) return erroForm(msg('email-invalido'));
    try {
      const r = await api({ action: 'inspEditar', codigo: S.codigo, inspId: f.dataset.id, nome: f.nome.value.trim(), matricula: f.matricula.value.trim(), area: f.area.value, email: f.email.value.trim().toLowerCase() });
      if (!r.ok) return erroForm(msg(r.erro));
      receber(r); fecharModal(); render(); toast('Inspetor atualizado.');
    } catch (e) { erroForm('Sem conexão com o servidor.'); }
  },
  equip(f) {
    const D = dados(), id = f.dataset.id, bal = f.bal.value, dos = bal === 'dos', nome = f.nome.value.trim();
    const ncav = Number(dos ? f.ncar.value : f.ncav.value), nret = dos ? 0 : Number(f.nret.value);
    if (!nome) return erroForm(msg('nome-equip'));
    if (!Number.isInteger(ncav) || ncav < 1) return erroForm(dos ? 'Informe a quantidade de rolos de carga da balança.' : msg('ncav'));
    if (!dos && (!Number.isInteger(nret) || nret < 0)) return erroForm(msg('nret'));
    if (Object.values(D.equip).some(e => e.id !== id && e.ativo !== false && chave(e.nome) === chave(nome))) return erroForm(msg('equip-existe'));
    if (id && (D.equip[id].bal || '') !== bal && itensAtivos(D).some(r => r.equipId === id)) return erroForm(msg('bal-pendencias'));
    if (id) {
      const maior = itensAtivos(D).filter(r => r.equipId === id && r.pos !== 'ret' && /^\d+$/.test(r.cav)).reduce((m, r) => Math.max(m, Number(r.cav)), 0);
      if (maior > ncav) return erroForm(dos ? 'Há rolo de carga nº ' + maior + ' marcado. A quantidade não pode ser menor.' : 'Há item marcado no cavalete ' + maior + '. A quantidade não pode ser menor.');
    }
    const d = { nome, area: f.area.value.trim(), bal, ncav, nret, tipoCarga: f.tipoCarga.value, tipoRetorno: f.tipoRetorno.value, tipoCav: f.tipoCav.value, tipoBal: f.tipoBal.value, tipoGuia: f.tipoGuia.value };
    if (id) enfileirar([{ c: 'equip', t: 'update', id, d }]);
    else {
      const nid = uid();
      enfileirar([{ c: 'equip', t: 'add', id: nid, d: Object.assign({ inspId: S.eu.id, ativo: true, criadoEm: Date.now() }, d) }]);
      fecharModal();
      if (f.dataset.insp) { iniciarInsp(nid); return; }
      V.equipId = nid; V.tela = 'equip'; render(); toast('Equipamento cadastrado.'); return;
    }
    fecharModal(); toast('Equipamento salvo.');
  },
  async tipo(f) {
    const T = tiposAtuais(), id = f.dataset.id, ni = f.ni.value.trim().toUpperCase(), preco = parsePreco(f.preco.value), cat = f.cat.value;
    if (!ni) return erroForm(msg('ni'));
    if (!isFinite(preco) || preco < 0) return erroForm('Preço inválido. Use, por exemplo, 185,90.');
    if (Object.values(T).some(t => t.id !== id && chave(t.ni) === chave(ni))) return erroForm(msg('ni-existe'));
    if (id && T[id].cat !== cat && usoAtual()[id]) return erroForm(msg('em-uso'));
    const d = { ni, cat, desc: f.desc.value.trim(), preco: Math.round(preco * 100) / 100 };
    const nid = id || uid();
    const op = id ? { c: 'tipo', t: 'update', id, d } : { c: 'tipo', t: 'add', id: nid, d: Object.assign({ criadoPor: S.eu ? S.eu.id : 'equipe', criadoEm: Date.now() }, d) };
    enfileirar([op]);
    if (!id && S.eu && V.insp && V.tela === 'insp') {
      V.insp.tipo = Object.assign({}, V.insp.tipo, { [cat]: nid }); salvarInsp();
      const e = dados().equip[V.insp.equipId], campo = { carga: 'tipoCarga', retorno: 'tipoRetorno', cavalete: 'tipoCav' }[cat];
      if (e && !e[campo] && (e.inspId === S.eu.id || S.admin)) enfileirar([{ c: 'equip', t: 'update', id: e.id, d: { [campo]: nid } }]);
    }
    fecharModal(); render(); toast('Salvo no cadastro geral.');
  },
  item(f) { enfileirar([{ c: 'rol', t: 'update', id: f.dataset.id, d: { tipoId: f.tipoId.value, obs: f.obs.value.trim() } }]); fecharModal(); toast('Alteração salva.'); },

};
function escolherInsp(id) {
  const i = dados().insp[id]; if (!i || !i.ativo) return;
  S.eu = { id: i.id, nome: i.nome, matricula: i.matricula, area: i.area, email: i.email || '' }; ls.set('ultimo', i.id);
  V.insp = ls.get('insp.' + i.id, null); V.listaSel = null;
  V.tela = V.insp ? 'insp' : 'inicio'; fecharModal(); render(); scrollTo(0, 0);
  if (V.insp) toast('Você tem uma inspeção em andamento.');
}
document.addEventListener('submit', ev => { const f = ev.target; ev.preventDefault(); const h = FORM[f.dataset.f]; if (h) h(f); });

/* ===== início ===== */
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get('s') && /^https:\/\/script\.google\.com\//.test(q.get('s'))) { S.srv = q.get('s'); ls.set('srv', S.srv); }
  if (q.get('e')) { S.codigo = q.get('e'); ls.set('codigo', S.codigo); }
  if (q.get('s') || q.get('e')) history.replaceState(null, '', location.pathname);
  render();
  if (S.codigo) sincronizar(true);
  setInterval(() => { if (document.visibilityState === 'visible') sincronizar(true); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(true); });
  window.addEventListener('online', () => sincronizar(true));
  window.addEventListener('offline', () => { S.online = false; render(true); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
